[package]
name = "hp-deskjet-1115"
version = "0.1.0"
edition = "2024"
authors = ["Luis Felipe"]
description = "Driver nativo, filtro CUPS PCL3GUI y centro de control GUI en Rust para HP DeskJet Ink Advantage 1115 (macOS Apple Silicon)"
default-run = "hp-deskjet-1115"

[[bin]]
name = "hp-deskjet-1115"
path = "src/main.rs"

[[bin]]
name = "rastertohp1115"
path = "src/bin/rastertohp1115.rs"

[dependencies]
eframe = "0.34.3"
egui = "0.34.3"
roxmltree = "0.20.0"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
clap = { version = "4.6.1", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
